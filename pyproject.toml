[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feldglas"
version = "0.0.1"
description = "feldglas: an instrument for looking at the embedding fields of medical images - the encoder contract, gates, pooling heads, a model of the unremarkable, and the suite that characterizes an encoder"
license = "Apache-2.0"
requires-python = ">=3.12"
# rankfield for ONE thing so far, its Geometry: a token lattice is a field in the family's own
# form (duckn's, which is NRRD's), so a read-out on it can go through the family's restore
# without a second, drifting description of where an array sits in the world.
dependencies = ["numpy>=1.24", "rankfield>=0.3"]

[project.optional-dependencies]
suite = ["scipy>=1.11"]          # distance transforms (gateability); nothing in the core needs it
radar = ["torch>=2.7"]           # ONLY to read upstream's text-embedding table (.pt); the head is numpy
modal = ["modal>=1.0"]           # tools/radar_export_modal.py - the one GPU step, encode -> field
# fields on a shared object store (R2): provender owns the blobs - content-addressed, written
# once, verified on fetch - and feldglas.remote owns only the manifest that names them. An
# extra, because a viewer pooling gates from local fields needs no store client at all.
remote = ["provender>=0.1.1"]
# the field as a duckn zarr zip (store 0.2): zarr writes and reads it, duckn's own models write its
# attributes (never hand-written dicts). Imported inside functions only - a viewer reading npz
# fields needs neither.
store = ["zarr>=3.3", "duckn"]
# the receiving end (feldglas.client, the `feldglas` command): zarr reads a field, obstore fetches
# fields and .seg.nrrd files by http(s) URL (a haversack server's path surface, a local `haversack
# serve`), click is the command line, scipy erodes a region
client = ["zarr>=3.3", "obstore>=0.11", "click>=8.1", "scipy>=1.11"]
test = ["pytest>=8", "scipy>=1.11", "scikit-learn>=1.4", "provender>=0.1.1", "zarr>=3.3", "duckn", "obstore>=0.11", "click>=8.1"]

[project.scripts]
feldglas = "feldglas.cli:main"

[tool.uv.sources]
rankfield = { git = "https://github.com/mhalle/rankfield.git", tag = "v0.3.2" }
provender = { git = "https://github.com/mhalle/provender.git", tag = "v0.1.1" }
duckn = { git = "https://github.com/mhalle/duckn.git", tag = "v0.5.1" }

[tool.hatch.build.targets.wheel]
packages = ["src/feldglas"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
